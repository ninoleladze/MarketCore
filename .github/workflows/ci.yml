name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MarketCore.sln

      - name: Build
        run: dotnet build MarketCore.sln --configuration Release --no-restore

      # Unit + integration tests (integration tests start SQL Server via Testcontainers;
      # Docker is available on GitHub-hosted Ubuntu runners)
      - name: Test
        run: >
          dotnet test MarketCore.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
